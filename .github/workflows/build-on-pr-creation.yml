name: Test build

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'jancis/branch1'
      - 'jancis/branch2'
      - 'sync/jancis/branch1'
      - 'sync/jancis/branch2'

permissions:
  contents: read
  pull-requests: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Checkout control repo for build action
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-repo

      - name: Test build images
        uses: ./control-repo/.github/actions/build-images
        with:
          push: 'false'
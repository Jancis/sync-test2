name: PR Test Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'jancis/**'
      - 'sync/**'

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sync-test2:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      - name: Test Docker image
        run: |
          echo "Testing Docker image..."
          docker images
          docker run --rm sync-test2:test --version || docker run --rm sync-test2:test echo "Image built successfully"
      
      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Build successful' : '❌ Build failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Docker Build Test\n\n${status}\n\nThe Docker image build has been tested without pushing to registry.`
            })


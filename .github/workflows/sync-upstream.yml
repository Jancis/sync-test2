name: Sync Upstream Branches

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - upstream_repo: 'https://github.com/jancis/sync-test1'
            upstream_branch: 'branch1'
            mirror_branch: 'sync/jancis/branch1'
            target_branch: 'jancis/branch1'
          - upstream_repo: 'https://github.com/jancis/sync-test1'
            upstream_branch: 'branch2'
            mirror_branch: 'sync/jancis/branch2'
            target_branch: 'jancis/branch2'
      fail-fast: false # Continue with other branches even if one fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream ${{ matrix.upstream_repo }} || git remote set-url upstream ${{ matrix.upstream_repo }}
          git fetch upstream ${{ matrix.upstream_branch }}
      
      - name: Check for changes
        id: check_changes
        run: |
          # Fetch or create mirror branch
          if git show-ref --verify --quiet refs/remotes/origin/${{ matrix.mirror_branch }}; then
            git fetch origin ${{ matrix.mirror_branch }}
            git checkout -B ${{ matrix.mirror_branch }} origin/${{ matrix.mirror_branch }}
          else
            echo "Mirror branch doesn't exist, will create it"
            git checkout -b ${{ matrix.mirror_branch }} upstream/${{ matrix.upstream_branch }}
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "is_new_branch=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Compare mirror branch with upstream
          if git diff --quiet ${{ matrix.mirror_branch }} upstream/${{ matrix.upstream_branch }}; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "is_new_branch=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate changelog
        if: steps.check_changes.outputs.has_changes == 'true'
        id: changelog
        run: |
          if [ "${{ steps.check_changes.outputs.is_new_branch }}" == "true" ]; then
            echo "This is a new sync branch"
            CHANGELOG="## Initial sync from upstream\n\nThis is the first sync of branch \`${{ matrix.upstream_branch }}\` from upstream repository."
          else
            # Generate changelog between mirror and upstream
            CHANGELOG=$(git log --pretty=format:"- %h: %s (%an)" ${{ matrix.mirror_branch }}..upstream/${{ matrix.upstream_branch }})
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="No commit messages available"
            fi
          fi
          
          # Save changelog to file to handle multiline content
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          # Also get file changes
          FILES_CHANGED=$(git diff --name-status ${{ matrix.mirror_branch }} upstream/${{ matrix.upstream_branch }} | head -20)
          echo "$FILES_CHANGED" > /tmp/files_changed.txt
      
      - name: Update mirror branch
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git checkout ${{ matrix.mirror_branch }}
          git reset --hard upstream/${{ matrix.upstream_branch }}
          git push origin ${{ matrix.mirror_branch }} --force
      
      - name: Ensure target branch exists
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Check if target branch exists, if not create it from mirror
          if ! git show-ref --verify --quiet refs/remotes/origin/${{ matrix.target_branch }}; then
            echo "Target branch doesn't exist, creating it"
            git checkout -b ${{ matrix.target_branch }} ${{ matrix.mirror_branch }}
            git push origin ${{ matrix.target_branch }}
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('/tmp/changelog.txt', 'utf8');
            const filesChanged = fs.readFileSync('/tmp/files_changed.txt', 'utf8');
            
            const prTitle = `Sync upstream changes from ${{ matrix.upstream_branch }}`;
            const prBody = `## Upstream Sync
            
            This PR syncs changes from upstream repository:
            - **Upstream Repository**: ${{ matrix.upstream_repo }}
            - **Upstream Branch**: \`${{ matrix.upstream_branch }}\`
            - **Mirror Branch**: \`${{ matrix.mirror_branch }}\`
            
            ### Commits
            \`\`\`
            ${changelog}
            \`\`\`
            
            ### Files Changed
            \`\`\`
            ${filesChanged}
            \`\`\`
            
            ---
            *This PR was automatically created by the sync-upstream workflow*`;
            
            // Check if PR already exists
            const { data: existingPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ matrix.mirror_branch }}`,
              base: '${{ matrix.target_branch }}',
              state: 'open'
            });
            
            if (existingPRs.length > 0) {
              // Update existing PR
              const pr = existingPRs[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: prBody
              });
              console.log(`Updated existing PR #${pr.number}`);
            } else {
              // Create new PR
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: '${{ matrix.mirror_branch }}',
                base: '${{ matrix.target_branch }}',
                body: prBody
              });
              console.log(`Created new PR #${pr.number}`);
            }

